<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quản lý sản phẩm - Đăng Đại Bakery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/admin_style.css">
  <style>
    .sim-alert {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: fit-content;
      z-index: 1060;
      min-width: 300px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div id="simulatedMessage" class="sim-alert alert" style="display: none;"></div>

  <div class="sidebar">
    <div class="brand"><i class="fa-solid fa-cake-candles me-2"></i>Đăng Đại Admin</div>
    <a href="dashboard.html"><i class="fa-solid fa-chart-line me-2"></i>Dashboard</a>
    <a href="products.html" class="active"><i class="fa-solid fa-bread-slice me-2"></i>Sản phẩm</a>
    <a href="categories.html"><i class="fa-solid fa-tags me-2"></i>Loại sản phẩm</a>
    <a href="orders.html"><i class="fa-solid fa-box me-2"></i>Đơn hàng</a>
    <a href="users.html"><i class="fa-solid fa-users me-2"></i>Khách hàng</a>
    <a href="inventory.html"><i class="fa-solid fa-warehouse me-2"></i>Tồn kho</a>
    <a href="login.html" class="text-danger"><i class="fa-solid fa-right-from-bracket me-2"></i>Đăng xuất</a>
  </div>

  <div class="main-content">
    <div class="navbar mb-4">
      <h5 class="fw-bold text-danger mb-0"><i class="fa-solid fa-bread-slice me-2"></i>Quản lý sản phẩm</h5>
      <div class="d-flex align-items-center gap-3">
        <button id="themeToggle" class="theme-toggle" title="Chuyển chế độ"><i class="fa-solid fa-moon"></i></button>
        <span class="text-muted small">Xin chào, <b>Admin</b></span>
        <img src="https://i.pravatar.cc/40?img=54" class="rounded-circle" alt="Admin">
      </div>
    </div>

    <div class="container-fluid" data-aos="fade-up">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <button class="btn btn-outline-danger" id="openAddModal"><i class="fa-solid fa-plus"></i> Thêm sản phẩm</button>
          <button class="btn btn-outline-secondary" id="refreshProducts"><i class="fa-solid fa-rotate"></i> Tải lại</button>
        </div>
        <div class="d-flex gap-2">
          <input id="searchProduct" class="form-control" placeholder="🔍 Tìm sản phẩm...">
          <select id="filterCategory" class="form-select w-auto">
            <option value="">Tất cả loại</option>
            <option>Bông lan</option>
            <option>Cookies</option>
            <option>Donut</option>
            <option>Macaron</option>
            <option>Tiramisu</option>
          </select>
        </div>
      </div>

      <div class="card shadow-sm">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover align-middle text-center">
              <thead class="table-light">
                <tr>
                  <th>Mã</th>
                  <th>Ảnh</th>
                  <th>Tên</th>
                  <th>Loại</th>
                  <th>Giá bán</th>
                  <th>Tồn</th>
                  <th>Hành động</th>
                </tr>
              </thead>
              <tbody id="productTableBody">
              </tbody>
            </table>
          </div>
          <!-- Pagination -->
          <nav class="mt-3">
            <ul class="pagination justify-content-center" id="pagination"></ul>
          </nav>
        </div>
      </div>
    </div>

    <!-- Modal thêm/sửa -->
    <div class="modal fade" id="productModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="productModalTitle">Thêm sản phẩm</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form id="productForm">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Mã sản phẩm</label>
                  <input id="p_code" class="form-control" value="" readonly>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Tên sản phẩm</label>
                  <input id="p_name" class="form-control" value="">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Loại</label>
                  <select id="p_category" class="form-select">
                    <option>Bông lan</option>
                    <option>Cookies</option>
                    <option>Donut</option>
                    <option>Macaron</option>
                    <option>Tiramisu</option>
                  </select>
                </div>
                <div class="col-md-3">
                  <label class="form-label">Giá vốn</label>
                  <input id="p_cost" type="number" class="form-control" value="">
                </div>
                <div class="col-md-3">
                  <label class="form-label">Giá bán</label>
                  <input id="p_price" type="number" class="form-control" value="">
                </div>
                <div class="col-md-4">
                  <label class="form-label">Số lượng</label>
                  <input id="p_qty" type="number" class="form-control" value="">
                </div>
                <div class="col-md-8">
                  <label class="form-label">Ảnh sản phẩm</label>
                  <input id="p_image" type="file" accept="image/*" class="form-control">
                  <div class="mt-2 text-center">
                    <img id="previewImage" src="../assets/images/noimg.png" alt="Preview" class="rounded-3"
                      style="max-height: 120px; object-fit: cover;">
                  </div>
                </div>
                <div class="col-12">
                  <label class="form-label">Mô tả</label>
                  <textarea id="p_desc" class="form-control" rows="3"></textarea>
                </div>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
            <button class="btn btn-danger" id="saveProduct">Lưu</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="mt-5 small text-center">© 2025 Đăng Đại Bakery Admin</footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init();

    const productModal = new bootstrap.Modal(document.getElementById('productModal'));
    const simMessage = document.getElementById('simulatedMessage');
    const tbody = document.getElementById('productTableBody');
    const pagination = document.getElementById('pagination');

    const perPage = 5;
    let currentPage = 1;

    const fullStaticProducts = [
      { code: 'BL1', name: 'Bông lan Trứng Muối', category: 'Bông lan', cost: 75000, price: 150000, qty: 18, image: '../images/BongLan/bonglan2.png', desc: 'Bánh bông lan mềm xốp kèm trứng muối béo ngậy' },
      { code: 'BL2', name: 'Bông lan Phô Mai Tươi', category: 'Bông lan', cost: 85000, price: 170000, qty: 15, image: '../images/BongLan/bonglan2.png', desc: 'Hương vị phô mai tươi mát, tan chảy' },
      { code: 'BL3', name: 'Bông lan Socola Chip', category: 'Bông lan', cost: 60000, price: 120000, qty: 22, image: '../images/BongLan/bonglan3.png', desc: 'Bông lan truyền thống rắc hạt socola' },
      { code: 'BL4', name: 'Bông lan Dâu Kem', category: 'Bông lan', cost: 80000, price: 160000, qty: 11, image: '../images/BongLan/bonglan1.png', desc: 'Sự kết hợp hoàn hảo của dâu tươi và lớp kem mượt mà' },
      { code: 'BL5', name: 'Bông lan Trà Xanh', category: 'Bông lan', cost: 65000, price: 130000, qty: 14, image: '../images/BongLan/bonglan5.png', desc: 'Hương trà xanh thơm nhẹ, không gây ngán' },
      { code: 'CK1', name: 'Cookies Bơ Truyền Thống', category: 'Cookies', cost: 45000, price: 90000, qty: 25, image: '../images/Cookies/cookie1.png', desc: 'Cookies giòn rụm với hương bơ thơm lừng' },
      { code: 'CK2', name: 'Cookies Socola Chip', category: 'Cookies', cost: 40000, price: 80000, qty: 30, image: '../images/Cookies/cookie2.png', desc: 'Món ăn vặt kinh điển với socola chip hảo hạng' },
      { code: 'CK3', name: 'Cookies Trà Xanh', category: 'Cookies', cost: 57500, price: 115000, qty: 19, image: '../images/Cookies/cookie3.png', desc: 'Vị trà xanh thanh mát, phù hợp cho người ăn kiêng' },
      { code: 'CK4', name: 'Cookies Bơ Đậu Phộng', category: 'Cookies', cost: 50000, price: 100000, qty: 21, image: '../images/Cookies/cookie4.png', desc: 'Thơm béo vị đậu phộng rang' },
      { code: 'CK5', name: 'Cookies Yến Mạch', category: 'Cookies', cost: 42500, price: 85000, qty: 28, image: '../images/Cookies/cookie5.png', desc: 'Cookies yến mạch giàu dinh dưỡng và chất xơ' },
      { code: 'DN2', name: 'Donut Socola', category: 'Donut', cost: 40000, price: 80000, qty: 17, image: '../images/Donut/donut2.png', desc: 'Donut truyền thống phủ lớp socola mịn' },
      { code: 'DN4', name: 'Donut Dừa', category: 'Donut', cost: 35000, price: 70000, qty: 16, image: '../images/Donut/donut4.png', desc: 'Donut phủ dừa sấy khô, thơm ngậy' },
      { code: 'DN5', name: 'Donut Phô Mai', category: 'Donut', cost: 45000, price: 90000, qty: 10, image: '../images/Donut/donut5.png', desc: 'Donut nhân phô mai tan chảy' },
      { code: 'DN15', name: 'Donut Nhân Mứt Việt Quất', category: 'Donut', cost: 32500, price: 65000, qty: 20, image: '../images/Donut/donut15.png', desc: 'Donut mềm với nhân mứt việt quất chua ngọt' },
      { code: 'DN10', name: 'Donut Kem Sữa', category: 'Donut', cost: 47500, price: 95000, qty: 12, image: '../images/Donut/donut10.png', desc: 'Donut béo ngậy với nhân kem sữa tươi' },
      { code: 'MC1', name: 'Macaron Dâu Tây', category: 'Macaron', cost: 60000, price: 120000, qty: 13, image: '../images/Macaron/macaron1.png', desc: 'Macaron màu hồng với nhân kem dâu tây' },
      { code: 'MC2', name: 'Macaron Socola Đen', category: 'Macaron', cost: 70000, price: 140000, qty: 9, image: '../images/Macaron/macaron2.png', desc: 'Vị socola đen đậm đà và vỏ giòn tan' },
      { code: 'MC4', name: 'Macaron Vani Kem Sữa', category: 'Macaron', cost: 62500, price: 125000, qty: 17, image: '../images/Macaron/macaron4.png', desc: 'Vị vani tinh tế và nhân kem sữa béo nhẹ' },
      { code: 'MC9', name: 'Macaron Hạt Dẻ', category: 'Macaron', cost: 75000, price: 150000, qty: 8, image: '../images/Macaron/macaron9.png', desc: 'Macaron cao cấp với nhân hạt dẻ rang thơm' },
      { code: 'MC14', name: 'Macaron Kem Bạc Hà', category: 'Macaron', cost: 50000, price: 100000, qty: 15, image: '../images/Macaron/macaron14.png', desc: 'Hương bạc hà the mát, độc đáo' },
      { code: 'TM1', name: 'Tiramisu Cổ Điển', category: 'Tiramisu', cost: 75000, price: 150000, qty: 10, image: '../images/Tiramisu/tiramisu1.png', desc: 'Tiramisu kiểu Ý truyền thống, vị cà phê đậm đà' },
      { code: 'TM2', name: 'Tiramisu Socola Đen', category: 'Tiramisu', cost: 90000, price: 180000, qty: 7, image: '../images/Tiramisu/tiramisu2.png', desc: 'Lớp socola đen nguyên chất, đắng nhẹ, ngọt thanh' },
      { code: 'TM4', name: 'Tiramisu Dâu Tây', category: 'Tiramisu', cost: 65000, price: 130000, qty: 14, image: '../images/Tiramisu/tiramisu4.png', desc: 'Phiên bản Tiramisu tươi mát với dâu tây' },
      { code: 'TM7', name: 'Tiramisu Caramel Muối', category: 'Tiramisu', cost: 87500, price: 175000, qty: 9, image: '../images/Tiramisu/tiramisu7.png', desc: 'Vị caramel muối độc đáo, cân bằng hoàn hảo' },
      { code: 'TM15', name: 'Tiramisu Cacao Đậm Vị', category: 'Tiramisu', cost: 97500, price: 195000, qty: 5, image: '../images/Tiramisu/tiramisu15.png', desc: 'Tiramisu với lượng cacao cao, hương vị cực kỳ đậm đà' }
    ];

    // Phân trang
    function getFilteredProducts() {
      const keyword = document.getElementById('searchProduct').value.toLowerCase();
      const category = document.getElementById('filterCategory').value;
      return fullStaticProducts.filter(p => {
        const matchesKeyword = p.name.toLowerCase().includes(keyword) || p.code.toLowerCase().includes(keyword);
        const matchesCategory = category === '' || p.category === category;
        return matchesKeyword && matchesCategory;
      });
    }

    function renderTable() {
      const data = getFilteredProducts();
      const start = (currentPage - 1) * perPage;
      const pagedData = data.slice(start, start + perPage);

      tbody.innerHTML = '';
      if (pagedData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-muted">Không tìm thấy sản phẩm nào.</td></tr>';
      } else {
        pagedData.forEach(p => {
          tbody.innerHTML += `
          <tr>
            <td>${p.code}</td>
            <td><img src="${p.image}" width="60" height="60" class="rounded-2" style="object-fit:cover" alt="${p.name}"></td>
            <td>${p.name}</td>
            <td>${p.category}</td>
            <td>${p.price.toLocaleString()} ₫</td>
            <td>${p.qty}</td>
            <td>
              <button class="btn btn-sm btn-outline-primary me-1 edit-btn" data-product-code="${p.code}"><i class="fa-solid fa-pen"></i></button>
              <button class="btn btn-sm btn-outline-danger delete-btn" data-product-name="${p.name}"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>`;
        });
      }

      // Pagination
      const totalPages = Math.ceil(data.length / perPage);
      pagination.innerHTML = '';
      for (let i = 1; i <= totalPages; i++) {
        pagination.innerHTML += `<li class="page-item ${i === currentPage ? 'active' : ''}">
          <button class="page-link">${i}</button>
        </li>`;
      }
      pagination.querySelectorAll('button').forEach((btn, idx) => {
        btn.onclick = () => {
          currentPage = idx + 1;
          renderTable();
        };
      });
    }

    document.getElementById('searchProduct').addEventListener('input', () => { currentPage = 1; renderTable(); });
    document.getElementById('filterCategory').addEventListener('change', () => { currentPage = 1; renderTable(); });
    document.getElementById('refreshProducts').addEventListener('click', () => {
      document.getElementById('searchProduct').value = '';
      document.getElementById('filterCategory').value = '';
      currentPage = 1;
      renderTable();
      showSimulatedMessage('Đã tải lại danh sách sản phẩm', 'success');
    });

    renderTable();
  </script>
</body>
</html>
