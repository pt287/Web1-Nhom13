<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quản lý tồn kho - Đăng Đại Bakery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/admin_style.css">
  <style>
    /* CSS ĐỒNG BỘ CƠ BẢN (TỪ QUẢN LÝ ĐƠN HÀNG/KHÁCH HÀNG) */
    body.dark .modal-content { background: #2b2b3a; color: #f5f5f5; }
    body.dark .form-control, body.dark .form-select { background-color: #1e1e2d; color: #f5f5f5; border-color: #444; }
    body.dark .list-group-item { background: transparent; color: #fff; border-color: #444; }
    
    /* STYLE CHO SIMULATED ALERT (ĐỒNG BỘ) */
    .sim-alert {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: fit-content;
      z-index: 1060;
      min-width: 300px;
      text-align: center;
      transition: opacity 0.3s ease;
    }

    /* STYLE CHO LOADING SPINNER */
    #loadingSpinner {
      position: fixed;
      top: 0; left: 0;
      z-index: 2000;
      display: none;
      background-color: rgba(0, 0, 0, 0.1);
      width: 100%; height: 100%;
    }
    #loadingSpinner .spinner-border {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }
    
    /* CSS ĐỒNG BỘ DARK MODE */
    body.dark #loadingSpinner {
        background-color: rgba(255, 255, 255, 0.05); /* Nền mờ cho Dark Mode */
    }
  </style>
</head>

<body>
<!-- Thông báo mô phỏng -->
<div id="simulatedMessage" class="sim-alert alert" style="display: none;"></div>
<div id="loadingSpinner"><div class="spinner-border text-danger" style="width:3rem;height:3rem;"></div></div>

<!-- Sidebar -->
<div class="sidebar">
  <div class="brand"><i class="fa-solid fa-cake-candles me-2"></i>Đăng Đại Admin</div>
  <a href="dashboard.html"><i class="fa-solid fa-chart-line me-2"></i>Dashboard</a>
  <a href="products.html"><i class="fa-solid fa-bread-slice me-2"></i>Sản phẩm</a>
  <a href="categories.html"><i class="fa-solid fa-tags me-2"></i>Loại sản phẩm</a>
  <a href="orders.html"><i class="fa-solid fa-box me-2"></i>Đơn hàng</a>
  <a href="users.html"><i class="fa-solid fa-users me-2"></i>Khách hàng</a>
  <a href="inventory.html" class="active"><i class="fa-solid fa-warehouse me-2"></i>Tồn kho</a>
  <a href="login.html" class="text-danger"><i class="fa-solid fa-right-from-bracket me-2"></i>Đăng xuất</a>
</div>

<!-- Main -->
<div class="main-content">
  <div class="navbar mb-4">
    <h5 class="fw-bold text-danger mb-0"><i class="fa-solid fa-warehouse me-2"></i>Quản lý tồn kho</h5>
    <div class="d-flex align-items-center gap-3">
      <button id="themeToggle" class="theme-toggle"><i class="fa-solid fa-moon"></i></button>
      <span class="text-muted small">Xin chào, <b>Admin</b></span>
      <img src="https://i.pravatar.cc/40?img=54" class="rounded-circle" alt="Admin">
    </div>
  </div>

  <div class="container-fluid" data-aos="fade-up">
    <!-- Toolbar -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <button class="btn btn-outline-secondary" id="refreshData"><i class="fa-solid fa-rotate"></i> Tải lại</button>
      </div>
      <div class="d-flex gap-2">
        <input id="searchItem" class="form-control" placeholder="🔍 Tìm theo tên / mã / loại...">
        <select id="filterStatus" class="form-select w-auto">
          <option value="">Tất cả trạng thái</option>
          <option value="ok">Còn hàng</option>
          <option value="low">Sắp hết</option>
          <option value="out">Hết hàng</option>
        </select>
      </div>
    </div>

    <!-- Table -->
    <div class="card shadow-sm">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-hover align-middle text-center">
            <thead class="table-light">
              <tr>
                <th>Mã SP</th><th>Tên sản phẩm</th><th>Loại</th><th>Giá</th><th>Số lượng</th><th>Ngày nhập</th><th>Trạng thái</th><th>Hành động</th>
              </tr>
            </thead>
            <tbody id="inventoryBody"></tbody>
          </table>
        </div>
        <nav class="mt-3">
          <ul class="pagination justify-content-center" id="pagination"></ul>
        </nav>
      </div>
    </div>
  </div>

  <!-- Modal chỉnh sửa -->
  <div class="modal fade" id="itemModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title fw-bold">Chỉnh sửa sản phẩm</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <form id="itemForm">
            <input type="hidden" id="itemId">
            <div class="mb-3"><label class="form-label">Tên sản phẩm</label><input id="itemName" class="form-control" required></div>
            <div class="mb-3"><label class="form-label">Loại</label><input id="itemCategory" class="form-control" required></div>
            <div class="mb-3"><label class="form-label">Giá (₫)</label><input id="itemPrice" type="number" class="form-control" required></div>
            <div class="mb-3"><label class="form-label">Số lượng</label><input id="itemQuantity" type="number" min="0" class="form-control" required></div>
            <div class="mb-3"><label class="form-label">Ngày nhập</label><input id="itemDate" type="date" class="form-control" required></div>
          </form>
        </div>
        <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button><button class="btn btn-danger" id="saveItem">Lưu</button></div>
      </div>
    </div>
  </div>

  <footer class="mt-5 small text-center">© 2025 Đăng Đại Bakery Admin</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

<script>
AOS.init();

// Dark mode
const themeBtn=document.getElementById('themeToggle');
if(localStorage.getItem('theme')==='dark'){document.body.classList.add('dark');themeBtn.innerHTML='<i class="fa-solid fa-sun"></i>';}
themeBtn.onclick=()=>{document.body.classList.toggle('dark');const dark=document.body.classList.contains('dark');themeBtn.innerHTML=dark?'<i class="fa-solid fa-sun"></i>':'<i class="fa-solid fa-moon"></i>';localStorage.setItem('theme',dark?'dark':'light');};

const showLoading=(s=true)=>{document.getElementById('loadingSpinner').style.display=s?'flex':'none';};

/* 🔔 Alert Message (ĐỒNG BỘ) */
function showSimulatedMessage(msg, type = 'success') {
    const simMessage = document.getElementById('simulatedMessage');
    // Xác định lớp màu và màu chữ dựa trên type
    const colorClass = type === 'success' ? 'alert-success' : type === 'warning' ? 'alert-warning' : type === 'info' ? 'alert-info' : 'alert-danger';
    const textColor = type === 'warning' || type === 'info' ? 'text-dark' : ''; 

    simMessage.textContent = msg;
    simMessage.className = `sim-alert alert ${colorClass} ${textColor} show`;
    simMessage.style.display = 'block';
    
    setTimeout(() => {
        simMessage.style.display = 'none';
    }, 3000);
}

// Sinh 40 sản phẩm mẫu (HARDCODE)
const categories=['Bông lan','Donut','Tiramisu','Cookie','Macaron'];
let inventory = [];
for(let i=1;i<=40;i++){
  const cat=categories[i%categories.length];
  inventory.push({
    id:'SP'+(1000+i),
    name: cat+' #'+i,
    category: cat,
    price: Math.floor(Math.random()*200000)+50000,
    qty: Math.floor(Math.random()*30),
    date: '2025-10-'+(i%28+1).toString().padStart(2,'0')
  });
}

// Dữ liệu giả lập kết quả tìm kiếm/lọc: hiển thị 3 sản phẩm đầu tiên
const simulatedSearchResults = inventory.slice(0, 3);


const tbody=document.getElementById('inventoryBody');
const pagination=document.getElementById('pagination');
let currentPage=1, perPage=5;

function getStatus(qty){
  if(qty<=0) return {text:'Hết hàng',cls:'danger'};
  if(qty<=5) return {text:'Sắp hết',cls:'warning'};
  return {text:'Còn hàng',cls:'success'};
}

// HÀM LỌC CHÍNH (BỊ THAY THẾ BẰNG MÔ PHỎNG)
function filterItems(){
  const k=document.getElementById('searchItem').value.toLowerCase().trim();
  const st=document.getElementById('filterStatus').value;
  
  if (k === '' && st === '') {
      // Không có tìm kiếm/lọc, hiển thị toàn bộ
      showSimulatedMessage('Hiển thị toàn bộ dữ liệu tồn kho.', 'success');
      return inventory;
  } else {
      // Có tìm kiếm/lọc, hiển thị kết quả giả lập
      let msg = '';
      if (k) msg += 'Đã tìm kiếm theo từ khóa. ';
      if (st) msg += 'Đã lọc theo trạng thái. ';
      
      showSimulatedMessage(`${msg.trim()} Hiển thị ${simulatedSearchResults.length} kết quả.`, 'info');
      return simulatedSearchResults;
  }
}

function renderItems(list){
  tbody.innerHTML='';
  const start=(currentPage-1)*perPage, data=list.slice(start,start+perPage);
  if (data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="text-muted">Không tìm thấy sản phẩm nào.</td></tr>';
      renderPagination([]);
      return;
  }
  
  data.forEach(i=>{
    const s=getStatus(i.qty);
    tbody.innerHTML+=`
      <tr>
        <td>${i.id}</td><td>${i.name}</td><td>${i.category}</td><td>${i.price.toLocaleString()} ₫</td>
        <td>${i.qty}</td><td>${i.date}</td>
        <td><span class="badge bg-${s.cls}">${s.text}</span></td>
        <td>
          <button class="btn btn-sm btn-outline-primary me-1 edit-btn" data-id="${i.id}"><i class="fa-solid fa-pen"></i></button>
          <button class="btn btn-sm btn-outline-danger delete-btn" data-id="${i.id}" data-name="${i.name}"><i class="fa-solid fa-trash"></i></button>
        </td>
      </tr>`;
  });
  renderPagination(list);
}

function renderPagination(list){
  const total=Math.max(1,Math.ceil(list.length/perPage));
  pagination.innerHTML='';
  for(let i=1;i<=total;i++){
    pagination.innerHTML+=`<li class="page-item ${i===currentPage?'active':''}"><button class="page-link">${i}</button></li>`;
  }
  // Gắn lại sự kiện cho các nút phân trang
  pagination.querySelectorAll('button').forEach((b,idx)=>b.onclick=()=>{
      currentPage=idx+1;
      const filteredList = filterItems(); // Lấy danh sách đã lọc (hoặc toàn bộ)
      renderItems(filteredList);
  });
}

// CÁC SỰ KIỆN MÔ PHỎNG
document.getElementById('searchItem').addEventListener('input',()=>{currentPage = 1; renderItems(filterItems());});
document.getElementById('filterStatus').onchange=()=>{currentPage = 1; renderItems(filterItems());};

document.getElementById('refreshData').onclick=()=>{
    showLoading();
    setTimeout(() => {
        // Mô phỏng tải lại dữ liệu tĩnh
        inventory = [...inventory]; 
        document.getElementById('searchItem').value = '';
        document.getElementById('filterStatus').value = '';
        currentPage = 1;
        renderItems(inventory);
        showSimulatedMessage('Đã tải lại dữ liệu tồn kho.', 'success');
        showLoading(false);
    }, 500);
};

// Chỉnh sửa & xóa (MÔ PHỎNG)
const modal=new bootstrap.Modal('#itemModal');
document.addEventListener('click',e=>{
  const id=e.target.closest('[data-id]')?.dataset.id; 
  if(!id)return;
  
  const it=inventory.find(i=>i.id===id);
  if(!it) return;

  // Mô phỏng chỉnh sửa
  if(e.target.closest('.edit-btn')){
    document.getElementById('itemId').value=it.id;
    document.getElementById('itemName').value=it.name;
    document.getElementById('itemCategory').value=it.category;
    document.getElementById('itemPrice').value=it.price;
    document.getElementById('itemQuantity').value=it.qty;
    document.getElementById('itemDate').value=it.date;
    modal.show();
  }
  
  // Mô phỏng xóa
  if(e.target.closest('.delete-btn')){
    const itemName = e.target.closest('.delete-btn').dataset.name;
    if(confirm('Xóa sản phẩm '+itemName+'?')){
        showSimulatedMessage(`Đã xóa sản phẩm ${itemName}. (Dữ liệu tĩnh không thay đổi)`, 'danger');
    }
  }
});

// Lưu chỉnh sửa (MÔ PHỎNG)
document.getElementById('saveItem').onclick=()=>{
  const name=document.getElementById('itemName').value.trim();
  const id=document.getElementById('itemId').value;

  if(!name){showSimulatedMessage('Vui lòng nhập đủ thông tin!','danger');return;}

  modal.hide();
  showSimulatedMessage(`Đã cập nhật sản phẩm ${id}: ${name}`, 'success');
  // Không cần render lại vì dữ liệu tĩnh không thay đổi
}

renderItems(inventory);
</script>
</body>
</html>
