<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quản lý loại sản phẩm - Đăng Đại Bakery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/admin_style.css">
</head>

<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="brand"><i class="fa-solid fa-cake-candles me-2"></i>Đăng Đại Admin</div>
    <a href="dashboard.html"><i class="fa-solid fa-chart-line me-2"></i>Dashboard</a>
    <a href="products.html"><i class="fa-solid fa-bread-slice me-2"></i>Sản phẩm</a>
    <a href="categories.html" class="active"><i class="fa-solid fa-tags me-2"></i>Loại sản phẩm</a>
    <a href="orders.html"><i class="fa-solid fa-box me-2"></i>Đơn hàng</a>
    <a href="users.html"><i class="fa-solid fa-users me-2"></i>Khách hàng</a>
    <a href="inventory.html"><i class="fa-solid fa-warehouse me-2"></i>Tồn kho</a>
    <a href="login.html" class="text-danger"><i class="fa-solid fa-right-from-bracket me-2"></i>Đăng xuất</a>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="navbar mb-4">
      <h5 class="fw-bold text-danger mb-0"><i class="fa-solid fa-tags me-2"></i>Quản lý loại sản phẩm</h5>
      <div class="d-flex align-items-center gap-3">
        <span class="text-muted small">Xin chào, <b>Admin</b></span>
        <img src="https://i.pravatar.cc/40?img=54" class="rounded-circle" alt="Admin">
      </div>
    </div>

    <div class="container-fluid">
      <!-- Toolbar -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <button class="btn btn-outline-danger" data-bs-toggle="modal" data-bs-target="#categoryModal">
          <i class="fa-solid fa-plus"></i> Thêm loại sản phẩm
        </button>
        <input class="form-control w-25" id="searchCategory" placeholder="🔍 Tìm loại sản phẩm...">
      </div>

      <!-- Table danh sách loại sản phẩm -->
      <div class="card shadow-sm">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover align-middle text-center">
              <thead class="table-light">
                <tr>
                  <th>Mã</th>
                  <th>Tên loại</th>
                  <th>Mô tả</th>
                  <th>Trạng thái</th>
                  <th>Hành động</th>
                </tr>
              </thead>
              <tbody id="categoryTableBody">
                <!-- Dữ liệu render bằng JS -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal thêm/sửa loại sản phẩm -->
    <div class="modal fade" id="categoryModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Thêm loại sản phẩm</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form id="categoryForm">
              <div class="mb-3">
                <label class="form-label">Mã loại</label>
                <input id="c_code" class="form-control" readonly>
              </div>
              <div class="mb-3">
                <label class="form-label">Tên loại</label>
                <input id="c_name" class="form-control">
              </div>
              <div class="mb-3">
                <label class="form-label">Mô tả</label>
                <textarea id="c_desc" class="form-control" rows="2"></textarea>
              </div>
              <div class="mb-3">
                <label class="form-label">Trạng thái</label>
                <select id="c_status" class="form-select">
                  <option value="1">Hiển thị</option>
                  <option value="0">Ẩn</option>
                </select>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
            <button class="btn btn-danger" id="saveCategory">Lưu</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="mt-5 small text-center">© 2025 Đăng Đại Bakery Admin</footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Dữ liệu mặc định 5 loại
    let categories = [
      { code: 'CT1', name: 'Bông lan', desc: 'Các loại bánh bông lan mềm xốp', status: 1 },
      { code: 'CT2', name: 'Donut', desc: 'Các loại bánh donut ngọt', status: 1 },
      { code: 'CT3', name: 'Tiramisu', desc: 'Bánh Tiramisu kiểu Ý', status: 1 },
      { code: 'CT4', name: 'Cookie', desc: 'Các loại bánh cookies giòn rụm', status: 1 },
      { code: 'CT5', name: 'Macaron', desc: 'Các loại bánh Macaron nhiều màu', status: 1 }
    ];

    const tbody = document.getElementById('categoryTableBody');
    const modal = new bootstrap.Modal(document.getElementById('categoryModal'));
    const modalTitle = document.querySelector('.modal-title');
    const c_code = document.getElementById('c_code');
    const c_name = document.getElementById('c_name');
    const c_desc = document.getElementById('c_desc');
    const c_status = document.getElementById('c_status');
    let editIndex = null;

    function renderTable(data) {
      tbody.innerHTML = '';
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-muted">Không có loại sản phẩm nào.</td></tr>';
        return;
      }
      data.forEach((c, i) => {
        tbody.innerHTML += `
          <tr>
            <td>${c.code}</td>
            <td>${c.name}</td>
            <td>${c.desc}</td>
            <td>${c.status == 1 ? 'Hiển thị' : 'Ẩn'}</td>
            <td>
              <button class="btn btn-sm btn-outline-primary me-1 edit-btn" data-index="${i}"><i class="fa-solid fa-pen"></i></button>
              <button class="btn btn-sm btn-outline-danger delete-btn" data-index="${i}"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>
        `;
      });
    }

    renderTable(categories);

    // Thêm loại sản phẩm mới
    document.querySelector('[data-bs-target="#categoryModal"]').addEventListener('click', () => {
      modalTitle.textContent = 'Thêm loại sản phẩm';
      c_code.value = 'CT' + (categories.length + 1);
      c_name.value = '';
      c_desc.value = '';
      c_status.value = 1;
      editIndex = null;
    });

    // Lưu loại sản phẩm
    document.getElementById('saveCategory').addEventListener('click', () => {
      if (!c_name.value.trim()) {
        alert('Vui lòng nhập tên loại sản phẩm.');
        return;
      }
      const newCategory = {
        code: c_code.value,
        name: c_name.value,
        desc: c_desc.value,
        status: parseInt(c_status.value)
      };
      if (editIndex !== null) {
        categories[editIndex] = newCategory;
      } else {
        categories.push(newCategory);
      }
      renderTable(categories);
      modal.hide();
    });

    // Chỉnh sửa loại
    tbody.addEventListener('click', (e) => {
      const btn = e.target.closest('.edit-btn');
      if (!btn) return;
      editIndex = parseInt(btn.dataset.index);
      const c = categories[editIndex];
      modalTitle.textContent = `Chỉnh sửa: ${c.name}`;
      c_code.value = c.code;
      c_name.value = c.name;
      c_desc.value = c.desc;
      c_status.value = c.status;
      modal.show();
    });

    // Xóa loại
    tbody.addEventListener('click', (e) => {
      const btn = e.target.closest('.delete-btn');
      if (!btn) return;
      const index = parseInt(btn.dataset.index);
      if (confirm(`Bạn có chắc chắn muốn xóa loại "${categories[index].name}"?`)) {
        categories.splice(index, 1);
        renderTable(categories);
      }
    });

    // Tìm kiếm
    document.getElementById('searchCategory').addEventListener('input', (e) => {
      const keyword = e.target.value.toLowerCase();
      const filtered = categories.filter(c => c.name.toLowerCase().includes(keyword));
      renderTable(filtered);
    });
  </script>
</body>
</html>
