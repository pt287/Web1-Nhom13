<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quản lý đơn hàng - Đăng Đại Bakery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/admin_style.css">
  <style>
    body.dark .modal-content { background: #2b2b3a; color: #f5f5f5; }
    body.dark .form-control, body.dark .form-select { background-color: #1e1e2d; color: #f5f5f5; border-color: #444; }
    body.dark .list-group-item { background: transparent; color: #fff; border-color: #444; }
    /* Style cho thông báo mô phỏng */
    .sim-alert {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: fit-content;
      z-index: 1060;
      min-width: 300px;
      text-align: center;
    }
  </style>
</head>

<body>
  <!-- Thông báo mô phỏng -->
  <div id="simulatedMessage" class="sim-alert alert" style="display: none;"></div>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="brand"><i class="fa-solid fa-cake-candles me-2"></i>Đăng Đại Admin</div>
    <a href="dashboard.html"><i class="fa-solid fa-chart-line me-2"></i>Dashboard</a>
    <a href="products.html"><i class="fa-solid fa-bread-slice me-2"></i>Sản phẩm</a>
    <a href="categories.html"><i class="fa-solid fa-tags me-2"></i>Loại sản phẩm</a>
    <a href="orders.html" class="active"><i class="fa-solid fa-box me-2"></i>Đơn hàng</a>
    <a href="users.html"><i class="fa-solid fa-users me-2"></i>Khách hàng</a>
    <a href="inventory.html"><i class="fa-solid fa-warehouse me-2"></i>Tồn kho</a>
    <a href="login.html" class="text-danger"><i class="fa-solid fa-right-from-bracket me-2"></i>Đăng xuất</a>
  </div>

  <!-- Main -->
  <div class="main-content">
    <div class="navbar mb-4">
      <h5 class="fw-bold text-danger mb-0"><i class="fa-solid fa-box me-2"></i>Quản lý đơn hàng</h5>
      <div class="d-flex align-items-center gap-3">
        <button id="themeToggle" class="theme-toggle" title="Chuyển chế độ"><i class="fa-solid fa-moon"></i></button>
        <span class="text-muted small">Xin chào, <b>Admin</b></span>
        <img src="https://i.pravatar.cc/40?img=54" class="rounded-circle" alt="Admin">
      </div>
    </div>

    <div class="container-fluid" data-aos="fade-up">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <!-- Nút Tạo đơn hàng đã bị xóa hoàn toàn khỏi HTML -->
          <button class="btn btn-outline-secondary" id="refreshOrders"><i class="fa-solid fa-rotate"></i> Tải lại</button>
        </div>
        <div class="d-flex gap-2">
          <!-- INPUT TÌM KIẾM THEO NGÀY MỚI -->
          <input type="date" id="filterDate" class="form-control w-auto" title="Tìm kiếm theo ngày">
          <input id="searchOrder" class="form-control" placeholder="🔍 Tìm theo mã / khách hàng...">
          <select id="filterStatus" class="form-select w-auto">
            <option value="">Tất cả trạng thái</option>
            <option>Đang xử lý</option>
            <option>Đã giao</option>
            <option>Hoàn tất</option>
            <option>Đã hủy</option>
          </select>
        </div>
      </div>

      <div class="card shadow-sm">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover align-middle text-center">
              <thead class="table-light">
                <tr>
                  <th>Mã đơn</th><th>Khách hàng</th><th>Ngày</th><th>Tổng tiền</th><th>Trạng thái</th><th>Hành động</th>
                </tr>
              </thead>
              <tbody id="orderTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal chi tiết -->
    <div class="modal fade" id="orderModal" tabindex="-1">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header"><h5 class="modal-title fw-bold">Chi tiết đơn hàng</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
          <div class="modal-body" id="orderDetailsBody"></div>
          <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button></div>
        </div>
      </div>
    </div>

    <!-- Modal tạo đơn - ĐÃ XÓA HOÀN TOÀN KHỎI HTML -->

    <footer class="mt-5 small text-center">© 2025 Đăng Đại Bakery Admin</footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init();
    
    const simMessage = document.getElementById('simulatedMessage');

    /* ========== HÀM MÔ PHỎNG THÔNG BÁO ========== */
    function showSimulatedMessage(message, type = 'success') {
      simMessage.textContent = message;
      simMessage.className = `sim-alert alert alert-${type}`;
      simMessage.style.display = 'block';
      setTimeout(() => {
        simMessage.style.display = 'none';
      }, 3000);
    }

    /* 🌙 DARK MODE */
    const themeBtn = document.getElementById('themeToggle');
    if (localStorage.getItem('theme') === 'dark') { document.body.classList.add('dark'); themeBtn.innerHTML = '<i class="fa-solid fa-sun"></i>'; }
    themeBtn.onclick = () => {
      document.body.classList.toggle('dark');
      const dark = document.body.classList.contains('dark');
      themeBtn.innerHTML = dark ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
      localStorage.setItem('theme', dark ? 'dark' : 'light');
    };

    /* 🧾 DỮ LIỆU TĨNH */
    const fullStaticOrders = [
        { id: 'DH001', name: 'Nguyễn Văn A', date: '2025-10-15', total: 50000, status: 'Hoàn tất', items: [{ name: 'Bông lan phô mai', qty: 2, price: 25000 }] },
        { id: 'DH002', name: 'Trần Thị B', date: '2025-10-14', total: 480000, status: 'Đang xử lý', items: [{ name: 'Cookies chocolate', qty: 4, price: 20000 }, { name: 'Donut socola', qty: 16, price: 25000 }] },
        { id: 'DH003', name: 'Lê Văn C', date: '2025-10-13', total: 200000, status: 'Đã giao', items: [{ name: 'Macaron mix', qty: 3, price: 30000 }, { name: 'Tiramisu mini', qty: 2, price: 55000 }] },
        { id: 'DH004', name: 'Phạm Thị D', date: '2025-10-12', total: 100000, status: 'Đã hủy', items: [{ name: 'Bông lan Trà Xanh', qty: 1, price: 100000 }] },
        { id: 'DH005', name: 'Võ Đình E', date: '2025-10-11', total: 450000, status: 'Hoàn tất', items: [{ name: 'Cookies Bơ Truyền Thống', qty: 5, price: 90000 }] },
        { id: 'DH006', name: 'Hồ Thị G', date: '2025-10-10', total: 120000, status: 'Đang xử lý', items: [{ name: 'Donut Dừa', qty: 1, price: 70000 }, { name: 'Bông lan phô mai', qty: 2, price: 25000 }] }
    ];
    let orders = [...fullStaticOrders]; 
    const simulatedSearchResults = fullStaticOrders.slice(0, 3); // Dữ liệu giả lập kết quả tìm kiếm/lọc

    /* 🧾 HIỂN THỊ BẢNG */
    const tbody = document.getElementById('orderTableBody');
    function renderOrders(data) {
        tbody.innerHTML = '';
        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-muted">Không tìm thấy đơn hàng nào.</td></tr>';
            return;
        }
        data.forEach((o, i) => {
            // Sử dụng mã ID để gắn vào nút View/Delete (thay cho index)
            const color = o.status === 'Hoàn tất' ? 'success' : o.status === 'Đã giao' ? 'info' : o.status === 'Đang xử lý' ? 'warning text-dark' : 'danger';
            tbody.innerHTML += `<tr>
                <td>${o.id}</td><td>${o.name}</td><td>${o.date}</td>
                <td>${o.total.toLocaleString()} ₫</td>
                <td><span class="badge bg-${color}">${o.status}</span></td>
                <td>
                    <button class="btn btn-sm btn-outline-primary me-1 view-btn" data-id="${o.id}"><i class="fa-solid fa-eye"></i></button>
                    <button class="btn btn-sm btn-outline-danger delete-btn" data-id="${o.id}" data-name="${o.name}"><i class="fa-solid fa-trash"></i></button>
                </td></tr>`;
        });
    }
    renderOrders(orders);

    /* 🔍 XEM CHI TIẾT */
    const orderModal = new bootstrap.Modal('#orderModal');
    document.addEventListener('click', e => {
        const btn = e.target.closest('.view-btn'); if (!btn) return;
        const o = fullStaticOrders.find(order => order.id === btn.dataset.id); 
        if (!o) return;
        
        const sList = ['Đang xử lý', 'Đã giao', 'Hoàn tất', 'Đã hủy'];
        const html = `
            <p><b>Mã đơn:</b> ${o.id}</p><p><b>Khách hàng:</b> ${o.name}</p><p><b>Ngày đặt:</b> ${o.date}</p>
            <label class="form-label fw-bold">Cập nhật trạng thái:</label>
            <select class="form-select mb-3 status-select-simulated">${sList.map(s => `<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select>
            <h6 class="fw-bold mb-2">Chi tiết sản phẩm</h6>
            <ul class="list-group mb-3">${o.items.map(i=>`<li class="list-group-item d-flex justify-content-between"><span>${i.name} × ${i.qty}</span><b>${(i.qty*i.price).toLocaleString()} ₫</b></li>`).join('')}</ul>
            <h6 class="text-end">Tổng cộng: <b class="text-danger">${o.total.toLocaleString()} ₫</b></h5>`;
        document.getElementById('orderDetailsBody').innerHTML = html;
        
        // MÔ PHỎNG CẬP NHẬT TRẠNG THÁI
        const statusSelect = document.querySelector('.status-select-simulated');
        statusSelect.onchange = e => { 
            const newStatus = e.target.value;
            showSimulatedMessage(`Đã cập nhật trạng thái đơn hàng ${o.id} sang: ${newStatus}.`, 'info');
        };

        orderModal.show();
    });

    /* ❌ XÓA ĐƠN */
    document.addEventListener('click', e => {
        const btn = e.target.closest('.delete-btn'); if (!btn) return;
        const id = btn.dataset.id;
        if (confirm(`Bạn có chắc muốn xóa đơn hàng ${id} của khách ${btn.dataset.name}?`)) { 
            showSimulatedMessage(`Đơn hàng ${id} đã được xóa. (Dữ liệu tĩnh không thay đổi)`, 'danger');
        }
    });

    /* 🔍 TÌM KIẾM VÀ LỌC (MÔ PHỎNG) */
    document.getElementById('searchOrder').oninput = filter;
    document.getElementById('filterStatus').onchange = filter;
    document.getElementById('filterDate').onchange = filter; // Lắng nghe sự kiện thay đổi ngày

    function filter(){
        const k = document.getElementById('searchOrder').value.toLowerCase().trim();
        const s = document.getElementById('filterStatus').value;
        const d = document.getElementById('filterDate').value; // Lấy giá trị ngày

        if (k === '' && s === '' && d === '') {
            renderOrders(fullStaticOrders); // Hiển thị đầy đủ nếu không có điều kiện
        } else {
            // Luôn hiển thị kết quả giả lập khi bất kỳ điều kiện nào được áp dụng
            renderOrders(simulatedSearchResults); 
            
            let message = '';
            if (d) {
                message += `Đã lọc theo ngày ${d}. `;
            }
            if (k) {
                message += `Đã tìm theo từ khóa. `;
            }
            if (s) {
                message += `Đã lọc theo trạng thái. `;
            }

            showSimulatedMessage(`${message.trim()} Hiển thị ${simulatedSearchResults.length} kết quả.`, 'info');
        }
    }

    /* 🔁 TẢI LẠI */
    document.getElementById('refreshOrders').onclick=()=>{ 
        renderOrders(fullStaticOrders); // Reset bảng về dữ liệu đầy đủ
        document.getElementById('searchOrder').value = '';
        document.getElementById('filterStatus').value = '';
        document.getElementById('filterDate').value = ''; // Reset ngày
        showSimulatedMessage('Đã tải lại danh sách đơn hàng.', 'success'); 
    };
  </script>
</body>
</html>
